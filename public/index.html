<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Preguntón</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%273%27 y=%273%27 width=%2710%27 height=%2710%27 fill=%27%23e5321f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">

  <header>
    <div class="between">
      <h1><i class="logo" aria-hidden="true"></i>Preguntón</h1>
      <div class="tiny muted" id="save-state">loading…</div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab on" data-view="study">Study</button>
      <button class="tab" data-view="sheets">Cheat sheets</button>
      <button class="tab" data-view="stats">Progress</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <section id="view-study">
    <div class="panel filters" id="filters"></div>
    <div class="panel" id="card"></div>
  </section>

  <section id="view-sheets" hidden>
    <div id="sheets"></div>
  </section>

  <section id="view-stats" hidden>
    <div class="stats-grid" id="headline"></div>

    <div class="panel">
      <div class="between">
        <strong>By topic</strong>
        <span class="tiny muted"><i class="key-sw seen"></i>seen · <i class="key-sw mast"></i>mastered</span>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="panel">
      <strong>Coming up</strong>
      <div class="forecast" id="forecast"></div>
    </div>

    <div class="panel">
      <div class="between">
        <strong>Recall or recognise</strong>
        <span class="tiny muted">from recall mode and open questions</span>
      </div>
      <div class="calibration" id="calibration"></div>
    </div>

    <div class="panel">
      <div class="between">
        <strong>Giving you trouble</strong>
        <span class="tiny muted">missed twice or more</span>
      </div>
      <div id="stuck"></div>
    </div>
  </section>

  <section id="view-settings" hidden>
    <div id="settings"></div>
  </section>

</div>

<div class="sh-ask" id="sh-ask" hidden></div>
<div class="toast" id="toast"></div>
<script src="core.js"></script>
<script src="sheets.js"></script>
<script src="settings.js"></script>
<script src="study.js"></script>
</body>
</html>
