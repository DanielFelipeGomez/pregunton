  <text x="78" y="290" font-size="13" fill="#141414" text-anchor="end">little</text>
  <text transform="translate(34 175) rotate(-90)" font-size="14" fill="#141414" text-anchor="middle">How much you remember</text>
  <line x1="90" y1="290" x2="90" y2="296" stroke="#141414" stroke-width="1.5"/>
