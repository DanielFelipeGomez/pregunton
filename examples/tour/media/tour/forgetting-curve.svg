  <text x="345" y="314" font-size="13" fill="#141414" text-anchor="middle">7</text>
  <line x1="600" y1="290" x2="600" y2="296" stroke="#141414" stroke-width="1.5"/>
  <text x="600" y="314" font-size="13" fill="#141414" text-anchor="middle">14</text>
  <text x="345" y="340" font-size="14" fill="#141414" text-anchor="middle">Days since you first learned it</text>
