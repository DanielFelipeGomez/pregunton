<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Intervals when you press Good every time</title>
  <desc id="d">Bar chart of the gap before the next review when every answer is Good and ease stays 2.5: 2, 6, 15, 38 and 95 days.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="32" y="36" font-size="16" font-weight="600" fill="#141414">Press Good every time (ease stays 2.5)</text>
  <text x="32" y="58" font-size="13" fill="#141414">Days until the next review</text>
  <line x1="90" y1="296" x2="620" y2="296" stroke="#141414" stroke-width="1.5"/>
  <rect x="110" y="291.4" width="64" height="4.6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="142" y="281.4" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">2 d</text>
  <text x="142" y="320" font-size="13" fill="#141414" text-anchor="middle">Review 1</text>
  <rect x="214" y="282.1" width="64" height="13.9" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="246" y="272.1" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">6 d</text>
  <text x="246" y="320" font-size="13" fill="#141414" text-anchor="middle">Review 2</text>
  <rect x="318" y="261.3" width="64" height="34.7" fill="#f2bb05" stroke="#141414" stroke-width="1.5"/>
  <text x="350" y="251.3" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">15 d</text>
  <text x="350" y="320" font-size="13" fill="#141414" text-anchor="middle">Review 3</text>
  <rect x="422" y="208" width="64" height="88" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="454" y="198" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">38 d</text>
  <text x="454" y="320" font-size="13" fill="#141414" text-anchor="middle">Review 4</text>
  <rect x="526" y="76" width="64" height="220" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="558" y="66" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">95 d</text>
  <text x="558" y="320" font-size="13" fill="#141414" text-anchor="middle">Review 5</text>
  <text x="350" y="340" font-size="13" fill="#8a8a8a" text-anchor="middle">6 × 2.5</text>
  <text x="454" y="340" font-size="13" fill="#8a8a8a" text-anchor="middle">15 × 2.5</text>
  <text x="558" y="340" font-size="13" fill="#8a8a8a" text-anchor="middle">38 × 2.5</text>
  <text x="142" y="340" font-size="13" fill="#8a8a8a" text-anchor="middle">first step</text>
  <text x="246" y="340" font-size="13" fill="#8a8a8a" text-anchor="middle">second step</text>
</svg>
