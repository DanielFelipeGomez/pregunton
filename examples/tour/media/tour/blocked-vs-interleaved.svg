<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Blocked versus interleaved practice</title>
  <desc id="d">Twelve practice problems of four types, A to D. Blocked: three of each type in a row. Interleaved: the same twelve problems shuffled so the type changes from one to the next.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="32" y="40" font-size="16" font-weight="600" fill="#141414">Same 12 problems, two orders</text>
  <text x="32" y="100" font-size="15" font-weight="600" fill="#141414">Blocked</text>
  <rect x="150" y="78" width="30" height="30" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="165" y="98" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="186" y="78" width="30" height="30" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="201" y="98" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="222" y="78" width="30" height="30" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="237" y="98" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="258" y="78" width="30" height="30" fill="#f2bb05" stroke="#141414" stroke-width="1.5"/>
  <text x="273" y="98" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">B</text>
  <rect x="294" y="78" width="30" height="30" fill="#f2bb05" stroke="#141414" stroke-width="1.5"/>
  <text x="309" y="98" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">B</text>
  <rect x="330" y="78" width="30" height="30" fill="#f2bb05" stroke="#141414" stroke-width="1.5"/>
  <text x="345" y="98" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">B</text>
  <rect x="366" y="78" width="30" height="30" fill="#17994f" stroke="#141414" stroke-width="1.5"/>
  <text x="381" y="98" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">C</text>
  <rect x="402" y="78" width="30" height="30" fill="#17994f" stroke="#141414" stroke-width="1.5"/>
  <text x="417" y="98" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">C</text>
  <rect x="438" y="78" width="30" height="30" fill="#17994f" stroke="#141414" stroke-width="1.5"/>
  <text x="453" y="98" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">C</text>
  <rect x="474" y="78" width="30" height="30" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
  <text x="489" y="98" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">D</text>
  <rect x="510" y="78" width="30" height="30" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
  <text x="525" y="98" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">D</text>
  <rect x="546" y="78" width="30" height="30" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
  <text x="561" y="98" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">D</text>
  <text x="150" y="140" font-size="13" fill="#141414">The section tells you the method. Practice feels smooth.</text>
  <text x="32" y="222" font-size="15" font-weight="600" fill="#141414">Interleaved</text>
  <rect x="150" y="200" width="30" height="30" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="165" y="220" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="186" y="200" width="30" height="30" fill="#17994f" stroke="#141414" stroke-width="1.5"/>
  <text x="201" y="220" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">C</text>
  <rect x="222" y="200" width="30" height="30" fill="#f2bb05" stroke="#141414" stroke-width="1.5"/>
  <text x="237" y="220" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">B</text>
  <rect x="258" y="200" width="30" height="30" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
  <text x="273" y="220" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">D</text>
  <rect x="294" y="200" width="30" height="30" fill="#f2bb05" stroke="#141414" stroke-width="1.5"/>
  <text x="309" y="220" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">B</text>
  <rect x="330" y="200" width="30" height="30" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="345" y="220" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="366" y="200" width="30" height="30" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
  <text x="381" y="220" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">D</text>
  <rect x="402" y="200" width="30" height="30" fill="#17994f" stroke="#141414" stroke-width="1.5"/>
  <text x="417" y="220" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">C</text>
  <rect x="438" y="200" width="30" height="30" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="453" y="220" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="474" y="200" width="30" height="30" fill="#f2bb05" stroke="#141414" stroke-width="1.5"/>
  <text x="489" y="220" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">B</text>
  <rect x="510" y="200" width="30" height="30" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
  <text x="525" y="220" font-size="15" font-weight="600" fill="#141414" text-anchor="middle">D</text>
  <rect x="546" y="200" width="30" height="30" fill="#17994f" stroke="#141414" stroke-width="1.5"/>
  <text x="561" y="220" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">C</text>
  <text x="150" y="262" font-size="13" fill="#141414">You must spot the type first. Practice feels harder.</text>
  <text x="32" y="322" font-size="13" fill="#8a8a8a">A–D: four kinds of problem, e.g. volumes of four different solids.</text>
</svg>
